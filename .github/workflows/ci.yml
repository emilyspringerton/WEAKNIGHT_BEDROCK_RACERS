name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev

      # Phase 0 (see CLAUDE.md/docs/NORTHSTAR.md): a real UDP server + SDL2/GL
      # client exist and are live-verified end-to-end against
      # GoblinFoxDragon's real worldapi heightmap endpoint.
      - name: Build server
        run: |
          set -euo pipefail
          gcc -std=c99 -D_DEFAULT_SOURCE -Wall -Wextra -O2 \
            -o racer_server \
            apps/server/src/main.c \
            -Ipackages \
            -lm

      - name: Build client
        run: |
          set -euo pipefail
          gcc -std=c99 -D_DEFAULT_SOURCE -Wall -Wextra -O2 \
            -o racer_client \
            apps/client/src/main.c \
            -Ipackages \
            $(pkg-config --cflags --libs sdl2) \
            -lGL -lGLU -lm

      # Windows client cross-compile + SDL2 bundle, mirroring SHANKPIT's
      # release.yml / REDGARDEN's ci.yml (EMILY/BACKLOG.md S170-263 --
      # founder: "WEAKNIGHT_BEDROCK_RACERS needs build artifacts matching
      # SHANKPIT/REDGARDEN pattern -- Windows client artifacts, run.bat,
      # SDL2"). Server stays Linux-only, same as both sibling repos -- only
      # the client is distributed as a Windows exe. -lglu32 is needed here
      # (unlike REDGARDEN's shader-based arena client) because this client
      # uses GL/glu.h directly (see apps/client/src/main.c).
      - name: Install mingw-w64 + SDL2 mingw devel package
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get install -y mingw-w64 zip
          rm -rf sdl2_mingw SDL2-2.30.10 SDL2-devel-2.30.10-mingw.tar.gz || true
          wget -q --timeout=30 --tries=3 --retry-connrefused \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw

      - name: Cross-compile Windows client
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -std=c99 -D_DEFAULT_SOURCE -O2 \
            -o WeaknightRacers.exe \
            apps/client/src/main.c \
            -I./sdl2_mingw/include \
            -Ipackages \
            -L./sdl2_mingw/lib \
            -lmingw32 -lSDL2main -lSDL2 \
            -lopengl32 -lglu32 -lws2_32 -lwinmm -lgdi32 -lm

      - name: Bundle Windows client artifact
        run: |
          set -euo pipefail
          BUILD="build_${{ github.run_number }}_${GITHUB_SHA::7}"

          mkdir -p WeaknightRacers_Client
          cp WeaknightRacers.exe WeaknightRacers_Client/
          cp sdl2_mingw/bin/SDL2.dll WeaknightRacers_Client/
          # No persistent public server deployment exists for this repo yet
          # (Phase 0, per CLAUDE.md/docs/NORTHSTAR.md) -- unlike REDGARDEN's
          # PLAY.bat, which points at a real always-on bot-pool IP, this one
          # defaults to localhost (matching the client's own --server-host/
          # --worldapi-host defaults) so it does the honest thing: connect to
          # a server running on the same machine. Update SERVER_HOST once a
          # real persistent deployment exists.
          printf '%s\r\n' "@echo off" "set SERVER_HOST=198.58.107.85" "set WORLDAPI_HOST=198.58.107.85" "echo Connecting to okemily.com ..." "WeaknightRacers.exe --server-host %SERVER_HOST% --worldapi-host %WORLDAPI_HOST%" "pause" > WeaknightRacers_Client/run.bat
          zip -r "WeaknightRacers_Client_${BUILD}.zip" WeaknightRacers_Client

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: weaknight-bedrock-racers-client
          path: WeaknightRacers_Client_*.zip

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same
  # exact pattern PITVIPER's own ci.yml established (2026-08-21), also just applied to SHANKPIT/
  # shankpit-460/REDGARDEN/GoblinFoxDragon/emily.cli this session: auto-bumps MINOR version only
  # on every real push to main (never PRs, never other branches -- this workflow's own top-level
  # trigger runs on every branch, so this job's own if: is what scopes releases -- and never the
  # tag-push this job's own release step triggers), major stays a human call. A REAL release (no
  # --prerelease flag). Reuses the same build already produced by the job above.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version;
      # actions/checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: weaknight-bedrock-racers-client
          path: dist

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            dist/WeaknightRacers_Client_*.zip \
            --title "$NEXT_VERSION" \
            --generate-notes
